name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the app version is derived by counting commits, and a
          # shallow clone computes 1.1.0 instead of the real number. That is
          # stamped into the page, so every hash taken over the page (the CSP
          # script hashes in particular) then disagrees with the committed one.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        working-directory: etl
        run: uv sync

      - name: Lint (ruff)
        working-directory: etl
        # Use the lockfile-pinned ruff (via uv run), not uvx which floats to
        # the latest release and silently breaks CI when ruff changes its rules.
        run: uv run ruff check .

      - name: Tests (pytest)
        working-directory: etl
        # Covers the em-dash guard and the page-generation checks that used to
        # live here as a shell heredoc, plus the parser and dataset suites.
        run: uv run pytest

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Stand-in map images
        working-directory: etl
        # The 865 rendered maps are 129 MB and not in the repository, so without
        # these the offline and save-for-offline tests cannot run at all, and
        # those are the ones worth having. Real 1x1 images at the real paths, so
        # the code under test is the real code path.
        run: uv run whereabouts-placeholder-images ../docs

      - name: Browser tests
        # Includes the accessibility scan (axe-core, WCAG 2.1 AA) and the
        # Content-Security-Policy check, which applies the generated policy to
        # the real page: a wrong script hash breaks the live site silently
        # otherwise, because the dev server never sends the header.
        working-directory: e2e
        # Runs against docs/ as committed. Network is blackholed inside the
        # browser (see e2e/playwright.config.js), so CI can never appear in the
        # analytics or field-failure data.
        run: npx playwright test
