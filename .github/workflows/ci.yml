name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        working-directory: etl
        run: uv sync

      - name: Lint (ruff)
        working-directory: etl
        # Use the lockfile-pinned ruff (via uv run), not uvx which floats to
        # the latest release and silently breaks CI when ruff changes its rules.
        run: uv run ruff check .

      - name: Tests (pytest)
        working-directory: etl
        # Covers the em-dash guard and the page-generation checks that used to
        # live here as a shell heredoc, plus the parser and dataset suites.
        run: uv run pytest

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: e2e
        # Runs against docs/ as committed. Network is blackholed inside the
        # browser (see e2e/playwright.config.js), so CI can never appear in the
        # analytics or field-failure data.
        run: npx playwright test
